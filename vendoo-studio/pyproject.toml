[project]
name = "vendoo-studio"
version = "0.1.595"
description = "Local web app for generating and automating Vendoo marketplace listings"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "protobuf>=6.33,<8",
    "pyjwt[crypto]>=2.15.1",
    "websockets>=13.0",
    "truststore>=0.10.0",
    "python-multipart>=0.0.9",
    "pillow>=13.0.0",
    # Security floors for the HTTP trust bundle and shared cache locks.
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "pillow-heif>=0.18",
    "hachoir>=3.4,<4",
    "numpy>=2.0",
    "rapidfuzz>=3.14,<4",
    "keyring>=25.0.0",
    "pyobjc-framework-Security>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "aiofiles>=24.0.0",
    "semble>=0.5.0",
    "cursor-sdk>=1.0.31",
    "claude-agent-sdk>=0.2.165",
]

[project.optional-dependencies]
# The hosted API runs on Postgres; the Mac app keeps SQLite and does not need this.
hosted = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pip-audit>=2.9",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.15",
]
desktop = [
    "pywebview>=5,<7",
]
package = [
    "pywebview>=5,<7",
    "pyinstaller>=6.3",
]

[project.scripts]
vendoo-studio = "vendoo_studio.main:main"
vendoo-studio-category-trees = "vendoo_studio.category_trees_cli:main"
anteroom = "vendoo_studio.cli.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server", "server/tests"]

[tool.ruff]
target-version = "py312"
src = ["server"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
# (str, Enum) and StrEnum format differently; keep the explicit mixins.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body", "fastapi.Header"]
