# fly.toml app configuration file generated for peaceful-meadowstone-6944 on 2026-10-30T01:31:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'peaceful-meadowstone-6944'
# Seattle no longer accepts new Machines; use the supported West Coast region.
primary_region = 'sjc'
kill_signal = 'SIGTERM'
kill_timeout = 300

[deploy]
  # Start the new Machine and move traffic to it before stopping the old one,
  # so a deploy never leaves no Machine to answer. See docs/hosted-production.md.
  strategy = 'bluegreen'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    VITE_SUPABASE_URL = 'https://ytoqdgtzvutdltfkpxbu.supabase.co'

[processes]
  # `app` serves sellers, the Mac and Chrome on a full CPU, so page loads never
  # wait behind generation. `worker` runs drafts, assistant answers and the
  # schedulers; it takes no public traffic. Keep the `app` name: renaming the
  # group would destroy the serving Machine on deploy. See docs/hosted-production.md.
  app = 'env ANTEROOM_PROCESS_ROLE=web python -m vendoo_studio.hosted_server'
  worker = 'env ANTEROOM_PROCESS_ROLE=worker python -m vendoo_studio.hosted_server'

[env]
  ANTEROOM_BACKGROUND_WORKER = '1'
  # Email every distinct error to the operator (services/error_alerts.py).
  ANTEROOM_ERROR_EMAIL = '1'
  SUPABASE_URL = 'https://ytoqdgtzvutdltfkpxbu.supabase.co'

[http_service]
  processes = ['app']
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # Requests, not TCP connections: long polls and listing reads share a
    # connection. No hard limit until a measured second machine can absorb
    # overflow; Fly's default soft limit stays in place for that reason.
    type = 'requests'

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

# The worker has no public service, so blue-green deploys wait on this check
# before stopping its old Machine. It also answers forwarded Mac and Chrome
# calls on the private network.
[checks.worker_alive]
  processes = ['worker']
  type = 'http'
  port = 8080
  method = 'get'
  path = '/api/health'
  interval = '30s'
  timeout = '5s'
  grace_period = '15s'

[[vm]]
  processes = ['app']
  memory = '2gb'
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 2048

# Generation mostly waits on the model, and a shared CPU banks burst credit
# while idle. Its sustained baseline is a fraction of a core, so a long run of
# generation slows drafts, never page loads. Move it to performance if drafts
# queue behind CPU.
[[vm]]
  processes = ['worker']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
