app = 'peaceful-meadowstone-6944'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    VITE_SUPABASE_URL = 'https://ytoqdgtzvutdltfkpxbu.supabase.co'

[env]
  SUPABASE_URL = 'https://ytoqdgtzvutdltfkpxbu.supabase.co'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
