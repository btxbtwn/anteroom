    /api/v2/item-price-suggestions:
        get:
            description: Returns the maximum suggested price for an item based on category, brand and condition, benchmarked against historical sold prices.
            operationId: GetItemPriceSuggestions
            parameters:
                - $ref: '#/components/parameters/HMACSignature'
                - description: The catalog (category) ID of the item. Use the ontologies endpoint to get the catalog tree.
                  in: query
                  name: catalog_id
                  required: true
                  schema:
                    format: int64
                    type: integer
                  x-go-name: CatalogID
                - description: The brand ID of the item.
                  in: query
                  name: brand_id
                  schema:
                    format: int64
                    type: integer
                  x-go-name: BrandID
                - description: The condition (status) ID of the item. Use the ontologies endpoint to get the statuses.
                  in: query
                  name: status_id
                  schema:
                    format: int64
                    type: integer
                  x-go-name: StatusID
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetItemPriceSuggestionsResponse'
                    description: Successfully retrieved maximum price suggestion.
                401:
                    $ref: '#/components/responses/Unauthorized'
                404:
                    description: No price suggestion available for the given combination.
                500:
                    description: An unexpected error occurred.
            security:
                - AccessKeyAuth: []
            summary: Get maximum price suggestion for an item.
            tags:
                - Items API
    /api/v2/ontologies:
        get:
            description: |
                This endpoint is being rolled out. Some size IDs in its response are not yet accepted for every account, so
                keep using `GetOntologies` until we contact you directly to switch.

                Gets the categories, item attributes, size groups and package sizes needed to create Vinted items in your
                account's country and currency. The response is large and changes rarely, so cache it and refetch it when
                `version.hash` changes.

                Items must be created in a leaf category, one without child `categories`, so start by mapping your categories
                to the leaves. Each leaf lists what applies to its items as keys of the top-level `item_attributes`,
                `size_groups` and `package_size_groups` maps.

                In `CreateItems`, send attributes with `options` as `item_attributes`, except `COLOUR`, which goes in the
                top-level `color_ids` field. `BRAND` and `ISBN` take free text, so send them in the top-level `brand` and
                `isbn` fields rather than in `item_attributes`.

                Compared to `GetOntologies`, colours and conditions are listed as item attributes, size groups and package sizes
                are keyed by ID, and `validation_rules` are not included.
            operationId: GetOntologiesV2
            parameters:
                - $ref: '#/components/parameters/HMACSignature'
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetOntologiesV2Response'
                    description: Successfully retrieved ontologies.
                400:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                    description: A validation error occured.
                401:
                    $ref: '#/components/responses/Unauthorized'
                500:
                    description: An unexpected error occured.
            security:
                - AccessKeyAuth: []
            summary: Get the ontologies for creating items
            tags:
                - Items API
    /dev/v1/triggers/item-sold/{itemID}:
        post:
            description: Use this endpoint to simulate making a sale. Only available in dev mode.
            operationId: TriggerItemSold
            parameters:
                - $ref: '#/components/parameters/HMACSignature'
                - description: The item ID.
                  in: path
                  name: itemID
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                200:
                    description: The item sale was successfully triggered.
                400:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                    description: A validation error occured.
                401:
                    description: The request had invalid authentication.
                404:
                    description: The item is not found.
                409:
                    description: The item is already sold.
                500:
                    description: An unexpected error occured.
            security:
                - AccessKeyAuth: []
            summary: Triggers the sale of an item
            tags:
                - Dev mode API
