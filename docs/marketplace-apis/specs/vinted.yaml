openapi: 3.0.3
info:
    title: Vinted Pro Integrations documentation
    version: v0.385.0
components:
    schemas:
        Address:
            properties:
                city:
                    type: string
                country_code:
                    description: ISO 3166 alpha-2 country code.
                    pattern: ^[A-Z]{2}$
                    type: string
                line_1:
                    type: string
                line_2:
                    type: string
                name:
                    description: Name of the addressee.
                    example: John Doe
                    type: string
                postal_code:
                    type: string
                state:
                    type: string
            required:
                - name
                - line_1
                - postal_code
                - city
                - country_code
            type: object
        CancelOrderFailureEventData:
            properties:
                error:
                    description: The error message.
                    type: string
                order_id:
                    description: The order ID.
                    format: int64
                    type: integer
                    x-go-name: OrderID
            required:
                - order_id
                - error
            type: object
        Catalog:
            properties:
                catalogs:
                    description: The child catalogs. Empty for leaf catalogs.
                    items:
                        $ref: '#/components/schemas/Catalog'
                    type: array
                disabled_fields:
                    description: Fields that are disabled for this catalog. Empty for non-leaf catalogs. Disabled fields will be ignored on an item when the catalog is set to this catalog.
                    items:
                        enum:
                            - brand
                            - size_id
                            - color_ids
                            - status_id
                            - package_size_id
                            - measurement_length
                            - measurement_width
                        type: string
                    type: array
                id:
                    description: The catalog ID.
                    type: integer
                item_attribute_ids:
                    description: The IDs of the item attributes associated with this catalog.
                    items:
                        type: string
                    type: array
                size_group_ids:
                    description: Only the provided size groups are valid for this catalog. Empty for non-leaf catalogs.
                    items:
                        type: integer
                    type: array
                title:
                    description: The catalog title.
                    type: string
            required:
                - id
                - title
            type: object
        Color:
            properties:
                id:
                    description: The color ID.
                    type: integer
                title:
                    description: The color title.
                    type: string
            required:
                - id
                - title
            type: object
        CompleteItemToCreate:
            allOf:
                - $ref: '#/components/schemas/ItemProperties'
                - $ref: '#/components/schemas/ItemReference'
                - $ref: '#/components/schemas/ItemIsDraft'
        CreateItemFailureEventData:
            $ref: '#/components/schemas/ItemIDAndReferenceWithErrors'
        CreateItemSuccessEventData:
            $ref: '#/components/schemas/ItemIDAndReference'
        CreateItemValidationError:
            $ref: '#/components/schemas/ValidationError'
        CreateItems:
            properties:
                items:
                    description: An array of items to create. At most 100 items can be created in a single request.
                    items:
                        $ref: '#/components/schemas/CompleteItemToCreate'
                    maxItems: 100
                    minItems: 1
                    type: array
            required:
                - items
            type: object
        CreateItemsResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ItemIDAndReference'
                    type: array
            required:
                - items
            type: object
        CreateItemsValidationErrorResponse:
            items:
                $ref: '#/components/schemas/CreateItemValidationError'
            type: array
        CreateUpdateWebhook:
            properties:
                event_types:
                    description: |
                        The event types that the webhook should subscribe to. At least one event type is required.

                        - `CREATE_ITEM_SUCCESS`: Triggered when an item is successfully created.
                        - `CREATE_ITEM_FAILURE`: Triggered when an item creation fails.
                        - `UPDATE_ITEM_SUCCESS`: Triggered when a requested item update succeeds.
                        - `UPDATE_ITEM_FAILURE`: Triggered when a requested item update fails.
                        - `DELETE_ITEM_SUCCESS`: Triggered when the requested deletion of an item succeeds.
                        - `DELETE_ITEM_FAILURE`: Triggered when the requested deletion of an item fails.
                        - `ITEM_DELETED`: Triggered when an item is deleted outside of VPI.
                        - `ITEM_SOLD`: Triggered when an item is sold.
                        - `ITEM_UPDATED`: Triggered when an item is updated outside of VPI.
                        - `ORDER_CREATED`: Triggered when an escrow order is created for one or more items. Note that this excludes manually completed orders.
                        - `CANCEL_ORDER_FAILURE`: Triggered when an order cancellation via VPI fails.
                        - `SHIPMENT_LABEL_CREATED`: Triggered when a shipment label is created for an order.
                        - `ITEM_PUBLISHED`: Triggered when an item is published and visible on the marketplace.
                        - `ORDER_CANCELLED`: Triggered when an order is cancelled due to a transaction cancellation. Includes the cancellation status code and description.
                        - `VINTED_AUTHENTICATION_ERROR`: Triggered when authentication with the Vinted Marketplace fails for this integration. Re-authenticate to restore access.
                        - `ITEM_DRAFT_UPDATED`: Triggered when an item draft is updated in the Marketplace.
                        - `ITEM_REUPLOADED`: Triggered when a relisted item is successfully reuploaded to the Marketplace, assigning a new `marketplace_item_id`.
                    items:
                        $ref: '#/components/schemas/WebhookEventType'
                    minItems: 1
                    type: array
                url:
                    description: The URL to POST the webhook to when the event occurs. Must be between 9 and 255 characters and start with http:// or https://.
                    format: url
                    maxLength: 255
                    minLength: 9
                    pattern: ^https?://.*
                    type: string
            required:
                - event_types
                - url
            type: object
        CreateWebhookError:
            properties:
                error:
                    enum:
                        - MAX_WEBHOOKS_EXCEEDED
                        - ONLY_HTTPS_URLS_ALLOWED
                    type: string
            required:
                - error
            type: object
        CreateWebhookResponse:
            properties:
                signing_key:
                    type: string
                webhook:
                    $ref: '#/components/schemas/Webhook'
            required:
                - webhook
                - signing_key
            type: object
        Currency:
            description: The currency used for prices.
            enum:
                - EUR
                - GBP
            type: string
            x-go-type-skip-optional-pointer: true
        DeleteItemFailureEventData:
            $ref: '#/components/schemas/ItemIDAndReference'
        DeleteItemSuccessEventData:
            $ref: '#/components/schemas/ItemIDAndReference'
        DeleteItems:
            properties:
                item_ids:
                    description: An array of item identifiers. When the items were created in VPI, you received an identifier for each item. Use that identifier to delete the item. At most 100 items can be deleted in a single request.
                    items:
                        format: uuid
                        type: string
                    maxItems: 100
                    minItems: 1
                    type: array
            required:
                - item_ids
            type: object
        DeleteItemsResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/DeleteItemsResponseItem'
                    type: array
            required:
                - items
            type: object
        DeleteItemsResponseItem:
            properties:
                accepted:
                    description: A boolean indicating if the deletion request for the item was accepted. Examples of reasons for an item deletion not to be accepted are than you do not own the item, the item was already deleted or the item was already sold.
                    type: boolean
                item_id:
                    format: uuid
                    type: string
                    x-go-name: ItemID
            required:
                - item_id
                - accepted
            type: object
        GetImportedItemsResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ImportedItem'
                    type: array
            required:
                - items
            type: object
        GetItemPriceSuggestionsResponse:
            properties:
                currency:
                    $ref: '#/components/schemas/Currency'
                maximum:
                    description: Upper bound of the suggested price range.
                    format: float
                    minimum: 0.01
                    type: number
            required:
                - currency
                - maximum
            type: object
        GetItemStatusResponse:
            properties:
                errors:
                    items:
                        $ref: '#/components/schemas/ValidationError'
                    type: array
                    x-go-type-skip-optional-pointer: true
                marketplace_item_id:
                    description: The public integer item ID as used in the website URLs for Vinted. Note that VPI does not accept this ID on any of its endpoints, only the UUID. However, VPI provides this ID because it can be useful to cross-reference with the Vinted website.
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/ItemStatus'
            required:
                - status
                - marketplace_item_id
            type: object
        GetItemsResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/GetItemsResponseItem'
                    type: array
            required:
                - items
            type: object
        GetItemsResponseItem:
            allOf:
                - $ref: '#/components/schemas/ItemIDAndReference'
                - $ref: '#/components/schemas/GetItemStatusResponse'
        GetOntologiesResponse:
            properties:
                enumerations:
                    description: Ontologies enumerations. Only values from these enumerations are valid for sending as item data. However, not all values from these enumerations are valid for all items. The Catalog object dictates some subsets of valid values.
                    properties:
                        catalogs:
                            items:
                                $ref: '#/components/schemas/Catalog'
                            type: array
                        colors:
                            items:
                                $ref: '#/components/schemas/Color'
                            type: array
                        item_attributes:
                            items:
                                $ref: '#/components/schemas/ItemAttribute'
                            type: array
                        package_sizes:
                            items:
                                $ref: '#/components/schemas/PackageSize'
                            type: array
                        size_groups:
                            items:
                                $ref: '#/components/schemas/SizeGroup'
                            type: array
                        statuses:
                            deprecated: true
                            description: Deprecated. Use the item attribute with the id `condition` from `item_attributes` instead, which carries the same options and the per-catalog rules that apply to them.
                            items:
                                $ref: '#/components/schemas/Status'
                            type: array
                    required:
                        - catalogs
                        - size_groups
                        - statuses
                        - package_sizes
                        - colors
                        - item_attributes
                    type: object
                validation_rules:
                    $ref: '#/components/schemas/ValidationRules'
                version:
                    description: Although most of the ontologies data is static, it does vary based on country and currency, therefore the ontologies are versioned using those properties + a date-time reference to when it was last updated.
                    properties:
                        country:
                            enum:
                                - AT
                                - BE
                                - DE
                                - ES
                                - FR
                                - IT
                                - LU
                                - NL
                                - PT
                                - UK
                            type: string
                        currency:
                            $ref: '#/components/schemas/Currency'
                        last_updated_on:
                            format: date-time
                            type: string
                    required:
                        - country
                        - currency
                        - last_updated_on
                    type: object
            required:
                - version
                - enumerations
                - validation_rules
            type: object
        GetOntologiesV2Response:
            properties:
                categories:
                    description: The category tree. Only leaf categories (categories without `categories`) are valid for items.
                    items:
                        $ref: '#/components/schemas/OntologyCategory'
                    type: array
                item_attributes:
                    additionalProperties:
                        $ref: '#/components/schemas/OntologyItemAttribute'
                    description: The item attributes named by the leaf categories, keyed by item attribute ID.
                    type: object
                package_size_groups:
                    additionalProperties:
                        $ref: '#/components/schemas/OntologyPackageSizeGroup'
                    description: The package size groups named by the leaf categories, keyed by package size group ID.
                    type: object
                size_groups:
                    additionalProperties:
                        $ref: '#/components/schemas/OntologySizeGroup'
                    description: The size groups named by the leaf categories, keyed by size group ID.
                    type: object
                version:
                    description: The country and currency the response applies to, and a hash of its content.
                    properties:
                        country:
                            description: The two-letter country code the ontologies apply to. The United Kingdom is `UK`.
                            maxLength: 2
                            minLength: 2
                            type: string
                        currency:
                            $ref: '#/components/schemas/Currency'
                        hash:
                            description: |
                                A digest of the response content. It changes whenever the content changes, so refetch when it differs
                                from the one you cached.
                            maxLength: 64
                            type: string
                    required:
                        - country
                        - currency
                        - hash
                    type: object
            required:
                - version
                - categories
                - item_attributes
                - size_groups
                - package_size_groups
            type: object
        GetOrderResponse:
            properties:
                amount:
                    description: The amount you will receive for this order.
                    format: float
                    minimum: 0.01
                    type: number
                billing_address:
                    $ref: '#/components/schemas/Address'
                created_at:
                    format: date-time
                    type: string
                currency:
                    $ref: '#/components/schemas/Currency'
                delivery_address:
                    $ref: '#/components/schemas/Address'
                id:
                    type: integer
                items:
                    description: The items in the order.
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                status:
                    $ref: '#/components/schemas/OrderStatus'
            required:
                - id
                - created_at
                - status
                - amount
                - currency
                - items
                - buyer
                - billing_address
                - delivery_address
            type: object
        GetOrderShipmentLabelNotFoundResponse:
            properties:
                error:
                    enum:
                        - ORDER_NOT_FOUND
                        - LABEL_CREATION_IN_PROGRESS
                        - LABEL_CREATION_FAILED
                    type: string
            required:
                - error
            type: object
        GetOrderShipmentResponse:
            properties:
                carrier:
                    properties:
                        name:
                            example: Vinted Go
                            type: string
                    type: object
                currency:
                    $ref: '#/components/schemas/Currency'
                price_ex_vat:
                    description: The price paid for the label, excluding VAT.
                    format: float
                    minimum: 0.01
                    type: number
                tracking_code:
                    description: The tracking code for the shipment. Will be empty for orders containing items that are not managed via Vinted Pro Integrations.
                    type: string
                vat_amount:
                    description: The VAT paid.
                    format: float
                    minimum: 0.01
                    type: number
            required:
                - carrier
                - status
                - tracking_code
                - price_ex_vat
                - vat_amount
            type: object
        GetOrdersResponse:
            properties:
                orders:
                    items:
                        $ref: '#/components/schemas/OrderListElement'
                    maxItems: 250
                    type: array
                    x-go-type-skip-optional-pointer: true
            type: object
        GetWebhooksResponse:
            items:
                $ref: '#/components/schemas/Webhook'
            type: array
        ImportedItem:
            properties:
                description:
                    type: string
                id:
                    format: uuid
                    type: string
                status:
                    $ref: '#/components/schemas/ItemStatus'
                title:
                    type: string
                url:
                    format: uri
                    type: string
            required:
                - id
                - url
                - title
                - description
                - status
            type: object
        ItemAttribute:
            properties:
                id:
                    description: The item attribute ID.
                    type: string
                is_required:
                    description: A boolean indicating if the item attribute is required.
                    type: boolean
                options:
                    description: The item attribute options.
                    items:
                        $ref: '#/components/schemas/ItemAttributeOption'
                    type: array
                selection_limit:
                    description: The item attribute options selection limit.
                    type: integer
                selection_type:
                    $ref: '#/components/schemas/ItemAttributeSelectionType'
                title:
                    description: The item attribute title.
                    type: string
            required:
                - id
                - title
                - is_required
                - selection_type
                - selection_limit
                - options
            type: object
        ItemAttributeInput:
            properties:
                item_attribute_id:
                    description: The item attribute ID, as returned in the ontologies response.
                    type: string
                item_attribute_option_ids:
                    description: The item attribute option IDs. Send at least one.
                    items:
                        format: int
                        type: integer
                    type: array
            type: object
        ItemAttributeOption:
            properties:
                id:
                    description: The item attribute option ID.
                    type: integer
                title:
                    description: The item attribute option title.
                    type: string
            required:
                - id
                - title
            type: object
        ItemAttributeSelectionType:
            description: The item attribute selection type.
            enum:
                - SINGLE
                - MULTIPLE
            type: string
        ItemDeletedEventData:
            $ref: '#/components/schemas/ItemIDAndReference'
        ItemDraftUpdatedEventData:
            allOf:
                - $ref: '#/components/schemas/ItemIDAndReference'
                - description: The current state of an item draft. A draft is a partial item, so most fields are optional.
                  properties:
                    brand_id:
                        description: The brand ID of the draft.
                        format: int64
                        nullable: true
                        type: integer
                        x-omitempty: false
                    catalog_id:
                        description: The catalog ID of the draft.
                        format: int64
                        nullable: true
                        type: integer
                        x-omitempty: false
                    color1_id:
                        description: The first color ID of the draft.
                        format: int64
                        nullable: true
                        type: integer
                        x-omitempty: false
                    color2_id:
                        description: The second color ID of the draft.
                        format: int64
                        nullable: true
                        type: integer
                        x-omitempty: false
                    currency:
                        $ref: '#/components/schemas/Currency'
                    description:
                        description: The description of the draft.
                        nullable: true
                        type: string
                        x-omitempty: false
                    package_size_id:
                        description: The package size ID of the draft.
                        format: int64
                        nullable: true
                        type: integer
                        x-omitempty: false
                    price:
                        description: The price of the draft (decimal represented as a string).
                        nullable: true
                        type: string
                        x-omitempty: false
                    size_id:
                        description: The size ID of the draft.
                        format: int64
                        nullable: true
                        type: integer
                        x-omitempty: false
                    status_id:
                        description: The status ID of the draft.
                        format: int64
                        nullable: true
                        type: integer
                        x-omitempty: false
                    title:
                        description: The title of the draft.
                        nullable: true
                        type: string
                        x-omitempty: false
                    updated_at:
                        description: The time the draft was last updated.
                        format: date-time
                        type: string
                  required:
                    - currency
                    - updated_at
                  type: object
        ItemIDAndReference:
            properties:
                item_id:
                    description: The main item identifier.
                    format: uuid
                    type: string
                    x-go-name: ItemID
                item_reference:
                    description: The item reference for the integrator to identify the item.
                    maxLength: 64
                    type: string
            required:
                - item_id
                - item_reference
            type: object
        ItemIDAndReferenceWithErrors:
            allOf:
                - $ref: '#/components/schemas/ItemIDAndReference'
                - properties:
                    errors:
                        items:
                            $ref: '#/components/schemas/ValidationError'
                        type: array
                        x-go-type-skip-optional-pointer: true
                    message:
                        type: string
                  type: object
        ItemIsDraft:
            properties:
                is_draft:
                    description: A boolean indicating whether the item is a draft.
                    type: boolean
                    x-go-type-skip-optional-pointer: true
            required:
                - is_draft
            type: object
        ItemProperties:
            properties:
                brand:
                    description: The item brand.
                    maxLength: 256
                    type: string
                    x-go-type-skip-optional-pointer: true
                catalog_id:
                    description: The ID of item catalog. This must be a leaf catalog. Use the ontologies endpoint to get the catalog tree.
                    format: int
                    type: integer
                    x-go-name: CatalogID
                    x-go-type-skip-optional-pointer: true
                color_ids:
                    description: The item colors IDs. Use the ontologies endpoint to get the colors.
                    items:
                        format: int
                        type: integer
                    maxItems: 2
                    type: array
                    x-go-name: ColorIDs
                currency:
                    $ref: '#/components/schemas/Currency'
                description:
                    description: The item description. Must be between 5 and 2000 characters.
                    maxLength: 2000
                    minLength: 5
                    type: string
                    x-go-type-skip-optional-pointer: true
                is_unisex:
                    description: A boolean indicating if item is unisex.
                    type: boolean
                isbn:
                    description: The ISBN of the book. Applicable to book catalogs only.
                    type: string
                    x-go-name: ISBN
                item_attributes:
                    description: The item attributes.
                    items:
                        $ref: '#/components/schemas/ItemAttributeInput'
                    type: array
                manufacturer:
                    description: Manufacturer credentials. E.g. "Mattel (USA)".
                    maxLength: 2000
                    minLength: 5
                    type: string
                manufacturer_labelling:
                    description: Labelling and marketing information. This should be general information on product safety and compliance such as safety warnings and instructions of use or safety marks/logo/certifications related to the product.
                    maxLength: 2000
                    minLength: 5
                    type: string
                measurement_length:
                    description: The item measurement length.
                    format: int
                    type: integer
                measurement_width:
                    description: The item measurement width.
                    format: int
                    type: integer
                package_size_id:
                    description: The ID of item package size. Use the ontologies endpoint to get the package sizes.
                    format: int
                    type: integer
                    x-go-name: PackageSizeID
                photo_urls:
                    description: The URLs of the item photos. Must be publicly accessible. At least one photo is required. The maximum size of a photo is 5MB.
                    items:
                        format: uri
                        maxLength: 640
                        minLength: 1
                        type: string
                    minItems: 1
                    type: array
                    x-go-type-skip-optional-pointer: true
                price:
                    description: The item price.
                    format: float
                    minimum: 1
                    type: number
                    x-go-type-skip-optional-pointer: true
                size_id:
                    description: The ID of item size. This is required for catalogs that have a size group (i.e. a non-empty size_group_ids array). Use the ontologies endpoint to get the size groups.
                    format: int
                    type: integer
                    x-go-name: SizeID
                status_id:
                    deprecated: true
                    description: Deprecated. Send the item condition as an item attribute with the id `condition` instead, using an option ID from that attribute in the ontologies response. If you send `status_id` and no `condition` attribute, the condition is still taken from `status_id`, but this fallback will be removed.
                    format: int
                    type: integer
                    x-go-name: StatusID
                title:
                    description: The item title. Must be between 5 and 100 characters.
                    maxLength: 100
                    minLength: 5
                    type: string
                    x-go-type-skip-optional-pointer: true
                video_game_rating_id:
                    description: The video game content rating ID. Applicable to video game catalogs only.
                    format: int
                    type: integer
                    x-go-name: VideoGameRatingID
            required:
                - title
                - photo_urls
                - currency
                - price
                - description
                - catalog_id
                - brand
                - package_size_id
            type: object
        ItemPublishedEventData:
            $ref: '#/components/schemas/ItemIDAndReference'
        ItemReference:
            properties:
                item_reference:
                    description: The item reference for the integrator to identify the item.
                    maxLength: 64
                    type: string
                    x-go-type-skip-optional-pointer: true
            required:
                - item_reference
            type: object
        ItemReuploadedEventData:
            allOf:
                - $ref: '#/components/schemas/ItemIDAndReference'
                - properties:
                    marketplace_item_id:
                        description: The new marketplace item ID after reupload. The item_id (UUID) stays stable across reuploads, but marketplace_item_id rotates.
                        format: int64
                        type: integer
                  required:
                    - marketplace_item_id
                  type: object
        ItemSoldEventData:
            $ref: '#/components/schemas/ItemIDAndReference'
        ItemStatus:
            description: The item status.
            enum:
                - IN_PROGRESS
                - ACTIVE
                - SOLD
                - DELETED
                - DELETE_INTERNAL_ERROR
                - VALIDATION_ERROR
                - UPDATE_INTERNAL_ERROR
                - UPDATE_VALIDATION_ERROR
                - INTERNAL_ERROR
                - SALE_CANCELLED
            type: string
        ItemToUpdate:
            allOf:
                - $ref: '#/components/schemas/ItemProperties'
                - $ref: '#/components/schemas/ItemIsDraft'
                - properties:
                    item_id:
                        description: The item ID.
                        format: uuid
                        type: string
                        x-go-name: ItemID
                  required:
                    - item_id
                  type: object
        ItemToValidate:
            description: An item to validate. Fields are intentionally loose (no length or presence constraints) so the validation rules, not the schema, report content problems. Only the fields currently validated are declared.
            properties:
                description:
                    description: The item description.
                    type: string
                    x-go-type-skip-optional-pointer: true
                item_reference:
                    description: The item reference for the integrator to identify the item in the response.
                    maxLength: 64
                    type: string
                    x-go-type-skip-optional-pointer: true
                manufacturer:
                    description: Manufacturer credentials.
                    type: string
                    x-go-type-skip-optional-pointer: true
                manufacturer_labelling:
                    description: Labelling and marketing information.
                    type: string
                    x-go-type-skip-optional-pointer: true
                price:
                    description: The item price. Omitted price is treated as missing (blank); a submitted price is range-checked.
                    format: float
                    type: number
                title:
                    description: The item title.
                    type: string
                    x-go-type-skip-optional-pointer: true
            required:
                - item_reference
            type: object
        ItemUpdatedEventData:
            allOf:
                - $ref: '#/components/schemas/ItemIDAndReference'
                - properties:
                    brand_id:
                        description: The brand ID of the item.
                        format: int
                        type: integer
                    catalog_id:
                        description: The catalog ID of the item.
                        format: int
                        type: integer
                    color1_id:
                        description: The first color ID of the item.
                        format: int
                        nullable: true
                        type: integer
                        x-omitempty: false
                    color2_id:
                        description: The second color ID of the item.
                        format: int
                        nullable: true
                        type: integer
                        x-omitempty: false
                    currency:
                        description: The currency of the item price.
                        type: string
                    description:
                        description: The description of the item.
                        type: string
                    package_size_id:
                        description: The package size ID of the item.
                        format: int
                        type: integer
                    price:
                        description: The price of the item.
                        format: float
                        type: number
                    size_id:
                        description: The size ID of the item.
                        format: int
                        nullable: true
                        type: integer
                        x-omitempty: false
                    status_id:
                        description: The status ID of the item.
                        format: int
                        type: integer
                    title:
                        description: The title of the item.
                        type: string
                    updated_attributes:
                        description: List of attribute names that were updated.
                        items:
                            enum:
                                - title
                                - description
                                - brand_id
                                - catalog_id
                                - color1_id
                                - color2_id
                                - currency
                                - package_size_id
                                - price
                                - size_id
                                - status_id
                            type: string
                        type: array
                  required:
                    - title
                    - description
                    - brand_id
                    - catalog_id
                    - currency
                    - price
                    - package_size_id
                    - status_id
                    - updated_attributes
                  type: object
