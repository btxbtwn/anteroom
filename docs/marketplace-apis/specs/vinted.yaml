                        - $ref: '#/components/schemas/CreateItemFailureEventData'
                        - $ref: '#/components/schemas/UpdateItemSuccessEventData'
                        - $ref: '#/components/schemas/UpdateItemFailureEventData'
                        - $ref: '#/components/schemas/DeleteItemSuccessEventData'
                        - $ref: '#/components/schemas/DeleteItemFailureEventData'
                        - $ref: '#/components/schemas/ItemDeletedEventData'
                        - $ref: '#/components/schemas/ItemSoldEventData'
                        - $ref: '#/components/schemas/ItemUpdatedEventData'
                        - $ref: '#/components/schemas/OrderCreatedEventData'
                        - $ref: '#/components/schemas/CancelOrderFailureEventData'
                        - $ref: '#/components/schemas/ShipmentLabelCreatedEventData'
                        - $ref: '#/components/schemas/ItemPublishedEventData'
                        - $ref: '#/components/schemas/OrderCancelledEventData'
                        - $ref: '#/components/schemas/VintedAuthenticationErrorEventData'
                        - $ref: '#/components/schemas/ItemDraftUpdatedEventData'
                        - $ref: '#/components/schemas/ItemReuploadedEventData'
                event_type:
                    $ref: '#/components/schemas/WebhookEventType'
                webhook_id:
                    format: uuid
                    type: string
            required:
                - event_type
                - webhook_id
                - event_data
            type: object
        WebhookEventType:
            description: The event type of the webhook.
            enum:
                - CREATE_ITEM_SUCCESS
                - CREATE_ITEM_FAILURE
                - UPDATE_ITEM_SUCCESS
                - UPDATE_ITEM_FAILURE
                - DELETE_ITEM_SUCCESS
                - DELETE_ITEM_FAILURE
                - ITEM_DELETED
                - ITEM_SOLD
                - ITEM_UPDATED
                - ORDER_CREATED
                - CANCEL_ORDER_FAILURE
                - SHIPMENT_LABEL_CREATED
                - ITEM_PUBLISHED
                - ORDER_CANCELLED
                - VINTED_AUTHENTICATION_ERROR
                - ITEM_DRAFT_UPDATED
                - ITEM_REUPLOADED
            type: string
    responses:
        Unauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UnauthorizedError'
            description: User is not authorized to use API.
    parameters:
        HMACSignature:
            description: Signature header. Reference script in documentation.
            in: header
            name: X-Vpi-Hmac-Sha256
            required: true
            schema:
                type: string
    securitySchemes:
        AccessKeyAuth:
            in: header
            name: X-Vpi-Access-Key
            type: apiKey
    requestBodies:
        CreateItemsBody:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateItems'
            description: The request body for creating items.
            required: true
        CreateUpdateWebhookBody:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateUpdateWebhook'
            description: The request body for creating or updating webhooks.
            required: true
        DeleteItemsBody:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/DeleteItems'
            description: The request body for deleting items.
            required: true
        RelistOrdersBody:
            content:
                application/json:
                    schema:
                        properties:
                            order_ids:
                                description: The Core escrow order IDs to relist.
                                items:
                                    format: int64
                                    type: integer
                                maxItems: 250
                                minItems: 1
                                type: array
                        required:
                            - order_ids
                        type: object
            description: The escrow order IDs to relist.
            required: true
        UpdateItemReferencesBody:
            content:
                application/json:
                    schema:
                        items:
                            $ref: '#/components/schemas/ItemIDAndReference'
                        type: array
            description: The request body for setting item references.
            required: true
        UpdateItemsBody:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateItems'
            description: The request body for updating items.
            required: true
        ValidateItemsBody:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidateItems'
            description: The request body for validating items.
            required: true
paths:
    /api/v1/items:
        delete:
            description: Deletes a batch of items in Vinted. At most 100 items can be deleted in a single request. Items are deleted asynchronously. Deleting item is only available for items that are successfully listed. Items that have the status `IN_PROGRESS` cannot be deleted.
            operationId: DeleteItems
            parameters:
                - $ref: '#/components/parameters/HMACSignature'
            requestBody:
                $ref: '#/components/requestBodies/DeleteItemsBody'
            responses:
                202:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteItemsResponse'
                    description: Request accepted. Deletions will be processed in the background. If items were not recognised as items that belong to your account the deletions will silently fail.
                400:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                    description: A validation error occured.
                401:
                    $ref: '#/components/responses/Unauthorized'
                404:
                    description: The item is not found.
                500:
                    description: An unexpected error occured.
            security:
                - AccessKeyAuth: []
            tags:
                - Items API
        get:
            description: Lists items that were created in VPI.
            operationId: GetItems
            parameters:
                - $ref: '#/components/parameters/HMACSignature'
                - description: If set, returns only items after the item with this ID. Used for paging.
                  in: query
                  name: after_item_id
                  schema:
                    format: uuid
                    type: string
                - description: The maximum number of items to return.
                  in: query
                  name: limit
                  schema:
                    format: int64
                    maximum: 250
                    minimum: 1
                    type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetItemsResponse'
                    description: The items.
                400:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                    description: A validation error occured.
                401:
                    $ref: '#/components/responses/Unauthorized'
                500:
                    description: An unexpected error occured.
            security:
                - AccessKeyAuth: []
            tags:
                - Items API
        post:
            description: Creates a batch of items in Vinted. At most 100 items can be created in a single request. Items are validated and uploaded asynchronously. The response contains the identifier for each item. This identifier is used to further interact with the item, make sure to store it on your end as well.
            operationId: CreateItems
            parameters:
                - $ref: '#/components/parameters/HMACSignature'
            requestBody:
                $ref: '#/components/requestBodies/CreateItemsBody'
            responses:
                202:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateItemsResponse'
                    description: Request accepted, items will be uploaded asynchronously. Receiving the item ID does not mean the item is listed.
                400:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                    description: A validation error occured.
                401:
                    $ref: '#/components/responses/Unauthorized'
                409:
                    content:
                        application/json:
                            schema:
                                properties:
                                    active_items:
                                        description: Number of active items for this account.
                                        format: int64
                                        type: integer
                                    attempted_batch_size:
                                        description: Number of items in the request.
                                        format: int64
                                        type: integer
                                    slots:
                                        description: Maximum number of items allowed for this account.
                                        format: int64
                                        type: integer
                                required:
                                    - slots
                                    - active_items
                                    - attempted_batch_size
                                type: object
                    description: Adding these items would exceed the maximum number of items allowed for this account, please reduce the number of active items before creating more.
                500:
                    description: An unexpected error occured.
            security:
                - AccessKeyAuth: []
            tags:
                - Items API
        put:
            description: Updates a batch of items in Vinted. At most 100 items can be updated in a single request. Items are validated and updated asynchronously. Updating item is only available for items that are successfully listed. Items that have the status `IN_PROGRESS` cannot be updated.
            operationId: UpdateItems
            parameters:
                - $ref: '#/components/parameters/HMACSignature'
            requestBody:
                $ref: '#/components/requestBodies/UpdateItemsBody'
            responses:
                202:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateItemsResponse'
                    description: Request accepted. Updates will be processed in the background. If items were not recognized as items that belong to your account the Updates will silently fail.
                400:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                    description: A validation error occured.
                401:
                    $ref: '#/components/responses/Unauthorized'
                500:
                    description: An unexpected error occured.
            security:
                - AccessKeyAuth: []
            tags:
                - Items API
    /api/v1/items/{id}/status:
        get:
            description: Retrieves the current status of an item on Vinted by its ID.
            operationId: GetItemStatus
            parameters:
                - $ref: '#/components/parameters/HMACSignature'
                - description: The item ID.
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
