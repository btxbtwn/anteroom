    /api/v1/ontologies:
        get:
            description: Gets the ontologies required to create valid Vinted items. For many fields the valid values depend on the category of the item. Therefore it's recommended to first map your category tree to Vinted's category tree before you map other product properties. Note that gender is encoded in the root categories at Vinted, but the category trees aren't equal for the Women, Men and Kids. This means your category mapping should take gender into account as well. Brands are omitted from the response due to the large number of brands available on Vinted. You can send any brand name when creating or updating an item which will automatically be mapped to a supported brand or VPI will leave the brand unassigned if its not recognised.
            operationId: GetOntologies
            parameters:
                - $ref: '#/components/parameters/HMACSignature'
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetOntologiesResponse'
                    description: Successfully retrieved ontologies.
                400:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                    description: A validation error occured.
                401:
                    $ref: '#/components/responses/Unauthorized'
                500:
                    description: An unexpected error occured.
            security:
                - AccessKeyAuth: []
            tags:
                - Items API
