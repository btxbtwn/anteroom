# XcodeGen spec. Run `xcodegen` in this folder to create Anteroom.xcodeproj.
name: Anteroom
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Pins packages to Config/Package.resolved and sets the app version.
  postGenCommand: tools/after-xcodegen.sh
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    # Exact, with every dependency pinned in Config/Package.resolved.
    exactVersion: 2.55.6
targets:
  Anteroom:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Anteroom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad windows turn with the device and resize for Split View and
        # Stage Manager, which needs every orientation.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Take photos of the items you are listing.
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.btxbtwn.anteroom.signin
            CFBundleURLSchemes:
              - anteroom
    settings:
      base:
        DEVELOPMENT_TEAM: JWN57LH9PU
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
  AnteroomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitTests]
    dependencies:
      - target: Anteroom
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  AnteroomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Anteroom
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AnteroomCloud:
    build:
      targets:
        Anteroom: all
        AnteroomTests: [test]
    test:
      targets: [AnteroomTests]
  Anteroom:
    build:
      targets:
        Anteroom: all
        AnteroomTests: [test]
        AnteroomUITests: [test]
    test:
      targets: [AnteroomTests, AnteroomUITests]
