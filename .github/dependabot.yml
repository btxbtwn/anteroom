# Weekly, grouped update pull requests for every pinned dependency. They go
# through CI like any other pull request and are merged only by the seller.
# Updates wait a week after release (cooldown) so a compromised or broken
# release has time to be pulled before it is proposed. Dependabot PRs carry no
# changelog.d/ note, so merging one ships without a version bump; add a note
# to the PR when the update should appear in What's new.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  # Base images of the hosted API image (pinned by digest).
  - package-ecosystem: docker
    directory: /deploy/fly
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      hosted-image:
        patterns: ["*"]

  # vendoo-studio/uv.lock: the Mac app, the hosted API, CI tools and the build backend.
  - package-ecosystem: uv
    directory: /vendoo-studio
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: a new release can find new errors and break the
      # recorded type-check baseline. Update it in its own PR.
      - dependency-name: basedpyright

  - package-ecosystem: npm
    directory: /vendoo-studio
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /webhook-relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      relay-minor-and-patch:
        update-types: [minor, patch]
