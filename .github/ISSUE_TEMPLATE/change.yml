name: Change
description: Request a feature or product change
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Anteroom
        - Chrome extension
        - Webhook relay
        - list-this skills
        - CI / repo hygiene
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would fix it.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: What a seller can do afterwards, written so it can become a test.
