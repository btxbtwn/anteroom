name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request replaces its older run. Every push to main
# runs to completion in its own group: main does not require PRs to be up to
# date, so a merge's checks are the only test of the combined code, and the
# deploy waits for them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which components this change touches. Jobs for untouched components are
  # skipped, and the CI job below counts a skip as a pass. Release commits from
  # the Version workflow only change version numbers, so they run the checks
  # in Changelog and Repo checks and skip the rest; their code was tested on
  # the pull request. Code merges still run affected suites on main to catch
  # interactions between independently tested PRs.
  changes:
    name: Changed components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      browser: ${{ steps.changes.outputs.browser }}
      health: ${{ steps.changes.outputs.health }}
      audit: ${{ steps.changes.outputs.audit }}
      extension: ${{ steps.changes.outputs.extension }}
      relay: ${{ steps.changes.outputs.relay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            # checkout tests a merge; its first parent is the actual base.
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          python3 .github/scripts/changed-components.py --base "$base" >> "$GITHUB_OUTPUT"

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Include the tested merge's parents for the PR comparison.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require a changelog entry for the version being shipped
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # checkout tests a merge; its first parent is the actual base.
            # The event's base SHA can predate a release already in that merge.
            python vendoo-studio/scripts/check-changelog.py --base "$(git rev-parse HEAD^1)"
          else
            python vendoo-studio/scripts/check-changelog.py
          fi

  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secrets scan reads the commits this change adds.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Version sync
        run: python vendoo-studio/scripts/check-version-sync.py
      - name: Reject case-insensitive path and module collisions
        run: |
          python - <<'PY'
          import subprocess
          import unicodedata
          from pathlib import PurePosixPath

          output = subprocess.check_output(["git", "ls-files", "-z"])
          paths = output.decode("utf-8", errors="surrogateescape").split("\0")
          module_suffixes = {".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs"}
          path_seen = {}
          module_seen = {}
          collisions = []
          for path in filter(None, paths):
              portable = unicodedata.normalize("NFC", path).casefold()
              previous = path_seen.setdefault(portable, path)
              if previous != path:
                  collisions.append(("path", previous, path))

              parsed = PurePosixPath(path)
              if parsed.suffix.casefold() in module_suffixes:
                  module = unicodedata.normalize("NFC", str(parsed.with_suffix(""))).casefold()
                  previous = module_seen.setdefault(module, path)
                  if previous != path:
                      collisions.append(("module", previous, path))

          if collisions:
              print("Tracked paths are ambiguous on case-insensitive filesystems:")
              for kind, left, right in collisions:
                  print(f"  {kind}: {left}\n          {right}")
              raise SystemExit(1)
          PY

      - name: Block tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|(^|/)credentials\.json$|(^|/)id_rsa$'; then
            echo "Secret-like files must not be tracked." >&2
            exit 1
          fi
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # The immutable official linux_x64 release asset; same checksum below.
          GITLEAKS_ASSET_ID: "378332058"
          # gitleaks_8.30.1_checksums.txt from the release.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          # Shared runners hit the unauthenticated API limit (HTTP 403); the job token raises it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 --retry-max-time 600 -o "$archive" \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_ASSET_ID}"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan working tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --verbose'
      - name: Scan the commits this change adds
        # A secret added in one commit and deleted in the next is gone from the
        # tree but still in the history that gets pushed.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="$(git merge-base HEAD^1 HEAD^2)..HEAD^2" ;;
            push)
              if [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="$BEFORE..$AFTER"
              else
                range="$AFTER^!"
              fi
              ;;
            *) echo "No pushed commits to scan for $GITHUB_EVENT_NAME."; exit 0 ;;
          esac
          echo "Scanning $range"
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --redact --verbose
      - name: Validate skill sources
        run: |
          test -f skills/list-this/SKILL.md
          python -m json.tool skills/list-this/references/vendoo-dropdown-options.json >/dev/null

  studio-frontend:
    name: Studio frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendoo-studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unused files, exports and dependencies (knip.json lists the ones that predate the check)
        run: npm run knip
      - run: npm test
      - run: npm run build
      - name: Build hosted workspace
        env:
          ANTEROOM_HOSTED_BUILD: "1"
          VITE_SUPABASE_URL: "https://build-validation.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "public-build-validation"
        run: npm run build

  studio-browser:
    name: Studio browser tests (${{ matrix.suite.name }})
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: sandbox
            script: e2e
          - name: hosted
            script: e2e:hosted
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vendoo-studio/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendoo-studio/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"
      - name: Install
        run: |
          python -m venv .venv
          ./scripts/install-locked.sh .venv/bin/python dev
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Compile Bridge network rules in Chromium
        if: matrix.suite.name == 'sandbox'
        run: node scripts/check-bridge-network.mjs
      - name: Verify remembered Bridge approval in Chromium
        if: matrix.suite.name == 'sandbox'
        run: node scripts/check-bridge-connection.mjs
      - name: Desktop and phone layouts (${{ matrix.suite.name }})
        run: npm run ${{ matrix.suite.script }}
      - name: Keep marketplace-session desktop and phone screenshots
        if: always() && matrix.suite.name == 'hosted'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-marketplace-sessions-screenshots
          path: vendoo-studio/e2e/results/hosted/session-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-browser-report-${{ matrix.suite.name }}
          path: |
            vendoo-studio/e2e/report
            vendoo-studio/e2e/results
          retention-days: 7

  studio-code-health:
    name: Studio code health
    needs: changes
    if: needs.changes.outputs.health == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vendoo-studio/uv.lock
      # basedpyright reads packages from .venv (pyproject.toml), as on a laptop.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"
      - name: Install
        run: |
          python -m venv .venv
          ./scripts/install-locked.sh .venv/bin/python dev
      - name: Types (new errors only; .basedpyright/baseline.json holds the old ones)
        run: .venv/bin/basedpyright
      - name: Layers (routes, services, repositories, models)
        run: .venv/bin/lint-imports
      - name: Unused functions, methods and classes
        run: .venv/bin/python scripts/check-dead-code.py
      - name: Design rules (DESIGN.md; design_baseline.json holds the old cases)
        run: .venv/bin/python scripts/check-design.py
      - name: Python lint
        run: .venv/bin/ruff check server

  dependency-audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    uses: ./.github/workflows/dependency-audit.yml

  studio-backend:
    name: Studio backend (${{ matrix.group }}/2)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vendoo-studio/uv.lock
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"
      - name: Install
        run: |
          # pytest-split (in the dev extra) divides the suite between the
          # shards; the full suite still runs, each test exactly once per database.
          ./scripts/install-locked.sh python dev
      - run: python -m pytest -q -n auto --splits 2 --group ${{ matrix.group }}
        env:
          VENDOO_STUDIO_DATA_DIR: ${{ runner.temp }}/vendoo-studio-data

  studio-backend-postgres:
    name: Studio backend Postgres (${{ matrix.group }}/2)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    services:
      postgres:
        # Pinned by digest (the postgres:16 index on 2026-11-11); Dependabot
        # proposes updates.
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vendoo-studio/uv.lock
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"
      - name: Install
        run: |
          # pytest-split (in the dev extra) divides the suite between the
          # shards; the full suite still runs, each test exactly once per database.
          ./scripts/install-locked.sh python dev
      # Each xdist worker creates its own database on this server.
      - run: python -m pytest -q -n auto --splits 2 --group ${{ matrix.group }}
        env:
          VENDOO_STUDIO_DATA_DIR: ${{ runner.temp }}/vendoo-studio-data
          ANTEROOM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  extension:
    name: Extension
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Include the tested merge's parents for the version comparison.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendoo-studio/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the linter (vendoo-studio's locked oxlint)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: vendoo-studio
      - name: Lint
        run: vendoo-studio/node_modules/.bin/oxlint -c vendoo-extension/.oxlintrc.json --deny-warnings vendoo-extension
      - name: Validate manifest and sample listing
        run: |
          python -m json.tool vendoo-extension/manifest.json >/dev/null
          python -m json.tool vendoo-extension/sample-listing.json >/dev/null
      - name: Syntax-check JavaScript
        run: |
          git ls-files 'vendoo-extension/*.js' 'vendoo-extension/background/*.js' 'vendoo-extension/content-scripts/*.js' \
            | while IFS= read -r file; do
                node --check "$file"
              done
      - name: Unit tests
        run: node --test 'vendoo-extension/tests/*.test.js'
      - name: Require a version bump for changed Bridge code
        if: github.event_name == 'pull_request'
        # checkout tests a merge; its first parent is the actual base.
        run: node vendoo-extension/tools/version-bump/check.js "$(git rev-parse HEAD^1)"

  webhook-relay:
    name: Webhook relay
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webhook-relay/package-lock.json
      - run: npm ci
        working-directory: webhook-relay
      - name: Tests
        run: npm test
        working-directory: webhook-relay

  ci:
    name: CI
    if: always()
    needs:
      - changes
      - changelog
      - repo-checks
      - studio-frontend
      - studio-browser
      - studio-code-health
      - dependency-audit
      - studio-backend
      - studio-backend-postgres
      - extension
      - webhook-relay
    runs-on: ubuntu-latest
    steps:
      # A job skips only when Changed components says its component did not
      # change; if that job itself fails, every job after it skips too, so it
      # has to succeed for a skip to count.
      - name: Require every job to succeed or skip an unchanged component
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Changed components: $CHANGES"
          echo "Job results: $RESULTS"
          [ "$CHANGES" = "success" ] || exit 1
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
