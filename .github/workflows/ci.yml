name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python vendoo-studio/scripts/check-version-sync.py

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit has to be here to tell a version bump from a rebase.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require a changelog entry for the version being shipped
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python vendoo-studio/scripts/check-changelog.py --base "$BASE_SHA"
          else
            python vendoo-studio/scripts/check-changelog.py
          fi

  portable-paths:
    name: Portable paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject case-insensitive path and module collisions
        run: |
          python - <<'PY'
          import subprocess
          import unicodedata
          from pathlib import PurePosixPath

          output = subprocess.check_output(["git", "ls-files", "-z"])
          paths = output.decode("utf-8", errors="surrogateescape").split("\0")
          module_suffixes = {".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs"}
          path_seen = {}
          module_seen = {}
          collisions = []
          for path in filter(None, paths):
              portable = unicodedata.normalize("NFC", path).casefold()
              previous = path_seen.setdefault(portable, path)
              if previous != path:
                  collisions.append(("path", previous, path))

              parsed = PurePosixPath(path)
              if parsed.suffix.casefold() in module_suffixes:
                  module = unicodedata.normalize("NFC", str(parsed.with_suffix(""))).casefold()
                  previous = module_seen.setdefault(module, path)
                  if previous != path:
                      collisions.append(("module", previous, path))

          if collisions:
              print("Tracked paths are ambiguous on case-insensitive filesystems:")
              for kind, left, right in collisions:
                  print(f"  {kind}: {left}\n          {right}")
              raise SystemExit(1)
          PY

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|(^|/)credentials\.json$|(^|/)id_rsa$'; then
            echo "Secret-like files must not be tracked." >&2
            exit 1
          fi
      - name: Scan working tree
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose

  studio-frontend:
    name: Studio frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendoo-studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build hosted workspace
        env:
          ANTEROOM_HOSTED_BUILD: "1"
          VITE_SUPABASE_URL: "https://build-validation.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "public-build-validation"
        run: npm run build

  studio-browser:
    name: Studio browser tests (sandbox)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendoo-studio/package-lock.json
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium
      - name: Desktop and phone layouts against the sandbox
        run: npm run e2e
      - name: Keep the report, screenshots and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-browser-report
          path: |
            vendoo-studio/e2e/report
            vendoo-studio/e2e/results
          retention-days: 7

  studio-backend:
    name: Studio backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - run: ruff check server
      - name: Audit installed Python dependencies
        run: python -m pip_audit
      - run: python -m pytest -q -n auto
        env:
          VENDOO_STUDIO_DATA_DIR: ${{ runner.temp }}/vendoo-studio-data

  studio-backend-postgres:
    name: Studio backend (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      # Each xdist worker creates its own database on this server.
      - run: python -m pytest -q -n auto
        env:
          VENDOO_STUDIO_DATA_DIR: ${{ runner.temp }}/vendoo-studio-data
          ANTEROOM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  studio-update-zip:
    name: Studio update zip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Check update zip symlink safety
        run: |
          python -m pytest -q \
            server/tests/test_packaged_updates.py \
            server/tests/test_bundle_symlinks.py
        env:
          VENDOO_STUDIO_DATA_DIR: ${{ runner.temp }}/vendoo-studio-update-zip

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate manifest and sample listing
        run: |
          python -m json.tool vendoo-extension/manifest.json >/dev/null
          python -m json.tool vendoo-extension/sample-listing.json >/dev/null
      - name: Syntax-check JavaScript
        run: |
          git ls-files 'vendoo-extension/*.js' 'vendoo-extension/background/*.js' 'vendoo-extension/content-scripts/*.js' \
            | while IFS= read -r file; do
                node --check "$file"
              done
      - name: Unit tests
        run: node --test 'vendoo-extension/tests/*.test.js'

  webhook-relay:
    name: Webhook relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webhook-relay/package-lock.json
      - run: npm ci
        working-directory: webhook-relay
      - name: Tests
        run: npm test
        working-directory: webhook-relay

  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate skill sources
        run: |
          test -f skills/list-this/SKILL.md
          python -m json.tool skills/list-this/references/vendoo-dropdown-options.json >/dev/null

  ci:
    name: CI
    if: always()
    needs:
      - version-sync
      - changelog
      - portable-paths
      - secrets
      - studio-frontend
      - studio-browser
      - studio-backend
      - studio-backend-postgres
      - studio-update-zip
      - extension
      - webhook-relay
      - skills
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
