name: Deploy hosted

# Ships the newest commit on main that passed CI (never older than the commit
# whose CI started the run), once CI passed on every merge since the commit
# production runs: builds and pushes the image first, so a build failure stops
# before the database changes; then
# applies pending Alembic revisions to Supabase with the migration login,
# refreshes the shared category trees when their seed changed, deploys that
# image to Fly.io and confirms the live version. See deploy/fly/README.md and
# docs/hosted-production.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

env:
  FLY_APP: peaceful-meadowstone-6944
  HEALTH_URL: https://myanteroom.com/api/health
  READY_URL: https://myanteroom.com/api/ready

jobs:
  deploy:
    name: Migrate and deploy
    # Only pushes to main that passed CI. Pull request runs never deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    # One deploy at a time and never cancelled mid-migration or mid-rollout.
    # On the job, not the workflow: a run whose job is skipped above (failed or
    # pull request CI) must not join the group and replace a queued deploy.
    concurrency:
      group: deploy-hosted
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Secrets live in this environment, which only main may use.
    environment: production
    timeout-minutes: 45
    steps:
      # All of main: the gate picks the newest tested commit from the trigger
      # up. CI runs finish out of order and a queued deploy can replace
      # another, so shipping the trigger itself could put older code over
      # newer code and a database already migrated past it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the newest tested commit on main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event.workflow_run.head_sha || github.sha }}
        # Checks out the newest first-parent commit from the trigger to main's
        # tip that passed CI and has no pending changelog.d/ notes (their
        # "Release Anteroom" commit ships that code). Skips when there is none.
        run: python3 .github/scripts/deploy-gate.py --repo "$GITHUB_REPOSITORY" --trigger "$TRIGGER"

      - name: Wait for CI on the code being shipped
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Every merge since the commit production runs (the last "Deployed
        # commit" notice) must have passed CI: CI on main checks only what each
        # merge changed. A release commit's merge may still be running.
        run: python3 .github/scripts/wait-for-tested-code.py --repo "$GITHUB_REPOSITORY"

      - name: Check deploy secrets
        if: steps.gate.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ANTEROOM_MIGRATION_DATABASE_URL: ${{ secrets.ANTEROOM_MIGRATION_DATABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in FLY_API_TOKEN ANTEROOM_MIGRATION_DATABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set for the production environment."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.gate.outputs.skip != 'true'
        with:
          version: "0.12.13"

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        if: steps.gate.outputs.skip != 'true'

      - name: Build the image
        id: image
        if: steps.gate.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          label="v${VERSION}-$(git rev-parse --short=8 HEAD)"
          flyctl deploy . --config deploy/fly/fly.toml --remote-only --build-only --push \
            --image-label "$label" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY"
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          echo "ref=registry.fly.io/${FLY_APP}:${label}" >> "$GITHUB_OUTPUT"

      - name: Install the hosted server
        if: steps.gate.outputs.skip != 'true'
        working-directory: vendoo-studio
        run: ./scripts/install-locked.sh python hosted

      - name: Apply pending migrations
        if: steps.gate.outputs.skip != 'true'
        working-directory: vendoo-studio
        env:
          # Session pooler (port 5432) URI for the migration login. Never the
          # runtime login, and never given to Fly.
          ANTEROOM_DATABASE_URL: ${{ secrets.ANTEROOM_MIGRATION_DATABASE_URL }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ github.workspace }}/deploy/fly/supabase-prod-ca-2021.crt
        run: |
          # The session pooler can be briefly full (ECHECKOUTTIMEOUT); wait for
          # a connection before migrating rather than failing the deploy.
          for attempt in 1 2 3 4 5; do
            python -m alembic current && break
            [ "$attempt" = 5 ] && exit 1
            echo "Database not reachable (attempt $attempt); retrying in 30s."
            sleep 30
          done
          python -m alembic upgrade head
          python -m alembic current

      - name: Refresh category trees when the seed changed
        if: steps.gate.outputs.skip != 'true'
        working-directory: vendoo-studio
        env:
          ANTEROOM_MIGRATION_DATABASE_URL: ${{ secrets.ANTEROOM_MIGRATION_DATABASE_URL }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ github.workspace }}/deploy/fly/supabase-prod-ca-2021.crt
        # Compares the trees in the database with the seed row for row, so a
        # refresh never depends on which earlier deploy imported what.
        run: ./scripts/category-trees.sh import --if-changed --database-url-env ANTEROOM_MIGRATION_DATABASE_URL

      - name: Deploy to Fly.io
        if: steps.gate.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          flyctl deploy . --config deploy/fly/fly.toml --ha=false --image "$IMAGE"

      - name: Confirm the live version
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            live="$(curl -fsS --max-time 10 "$HEALTH_URL" | python -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)"
            # Ready also means the database is at the schema this build expects.
            if [ "$live" = "$VERSION" ] && curl -fsS --max-time 10 "$READY_URL" >/dev/null; then
              echo "Production is serving $VERSION on the expected schema."
              exit 0
            fi
            echo "Live version '${live}', expecting $VERSION (attempt $attempt)."
            sleep 10
          done
          echo "::error::Production did not report version $VERSION as ready."
          exit 1

      # The public URL reaches only the web Machines; this also covers process
      # groups without a public service, such as a background worker.
      - name: Confirm every Machine runs the new image
        if: steps.gate.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LABEL: ${{ steps.image.outputs.label }}
        run: |
          for attempt in $(seq 1 12); do
            flyctl machines list --app "$FLY_APP" --json > "$RUNNER_TEMP/machines.json"
            python3 .github/scripts/check-fly-machines.py --label "$LABEL" "$RUNNER_TEMP/machines.json" && exit 0
            echo "Not every Machine is started on $LABEL yet (attempt $attempt)."
            sleep 10
          done
          echo "::error::Not every Machine is running $LABEL."
          exit 1

      # The next deploy reads this notice to find the commit production runs
      # (.github/scripts/wait-for-tested-code.py).
      - name: Record the deployed commit
        if: steps.gate.outputs.skip != 'true'
        run: echo "::notice title=Deployed commit::$(git rev-parse HEAD)"
