name: Deploy hosted

# Ships main to production once CI has passed on it: applies pending Alembic
# revisions to Supabase with the migration login, refreshes the shared category
# trees when their seed changed, then deploys the hosted API to Fly.io and
# confirms the live version. See deploy/fly/README.md and
# docs/hosted-production.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time and never cancelled mid-migration or mid-rollout.
concurrency:
  group: deploy-hosted
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  HEALTH_URL: https://myanteroom.com/api/health
  READY_URL: https://myanteroom.com/api/ready

jobs:
  deploy:
    name: Migrate and deploy
    # Only pushes to main that passed CI. Pull request runs never deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Secrets live in this environment, which only main may use.
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Wait for the release commit
        id: gate
        run: |
          # A merge with pending notes is followed by a "Release Anteroom" commit
          # from the Version workflow; deploy that one instead of both.
          if find changelog.d -type f ! -name README.md | grep -q .; then
            echo "Pending changelog notes; the release commit will deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$(cat vendoo-studio/VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deploy secrets
        if: steps.gate.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ANTEROOM_MIGRATION_DATABASE_URL: ${{ secrets.ANTEROOM_MIGRATION_DATABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in FLY_API_TOKEN ANTEROOM_MIGRATION_DATABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set for the production environment."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install the hosted server
        if: steps.gate.outputs.skip != 'true'
        working-directory: vendoo-studio
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[hosted]"

      - name: Apply pending migrations
        if: steps.gate.outputs.skip != 'true'
        working-directory: vendoo-studio
        env:
          # Session pooler (port 5432) URI for the migration login. Never the
          # runtime login, and never given to Fly.
          ANTEROOM_DATABASE_URL: ${{ secrets.ANTEROOM_MIGRATION_DATABASE_URL }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ github.workspace }}/deploy/fly/supabase-prod-ca-2021.crt
        run: |
          python -m alembic current
          python -m alembic upgrade head
          python -m alembic current

      - name: Refresh category trees when the seed changed
        if: steps.gate.outputs.skip != 'true'
        working-directory: vendoo-studio
        env:
          GH_TOKEN: ${{ github.token }}
          ANTEROOM_MIGRATION_DATABASE_URL: ${{ secrets.ANTEROOM_MIGRATION_DATABASE_URL }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ github.workspace }}/deploy/fly/supabase-prod-ca-2021.crt
        run: |
          seed=vendoo-studio/data/category-trees-seed.json.gz
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-hosted.yml \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -n "$previous" ] && git cat-file -e "$previous^{commit}" 2>/dev/null \
            && git diff --quiet "$previous" HEAD -- "../$seed"; then
            echo "Category tree seed unchanged since $previous."
            exit 0
          fi
          ./scripts/category-trees.sh import --database-url-env ANTEROOM_MIGRATION_DATABASE_URL

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
        if: steps.gate.outputs.skip != 'true'

      - name: Deploy to Fly.io
        if: steps.gate.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          flyctl deploy . --config deploy/fly/fly.toml --remote-only --ha=false \
            --image-label "v${VERSION}-$(git rev-parse --short=8 HEAD)" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY"

      - name: Confirm the live version
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            live="$(curl -fsS --max-time 10 "$HEALTH_URL" | python -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)"
            # Ready also means the database is at the schema this build expects.
            if [ "$live" = "$VERSION" ] && curl -fsS --max-time 10 "$READY_URL" >/dev/null; then
              echo "Production is serving $VERSION on the expected schema."
              exit 0
            fi
            echo "Live version '${live}', expecting $VERSION (attempt $attempt)."
            sleep 10
          done
          echo "::error::Production did not report version $VERSION as ready."
          exit 1
