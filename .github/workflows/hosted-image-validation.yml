name: Hosted image validation

on:
  pull_request:
    paths:
      - 'deploy/fly/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/hosted-image-validation.yml'
      - '.github/hosted-image-smoke.sh'
      - '.github/scripts/test-hosted-image-smoke.py'
      - 'vendoo-studio/pyproject.toml'
      - 'vendoo-studio/uv.lock'
      - 'vendoo-studio/package*.json'
      - 'vendoo-studio/src/**'
      - 'vendoo-studio/server/vendoo_studio/**'
      - 'skills/**'
      - 'vendoo-extension/manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and smoke hosted image (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check Postgres readiness polling with mocked Docker
        run: python3 .github/scripts/test-hosted-image-smoke.py
      - name: Build exact source and smoke on disposable data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-validation "$RUNNER_TEMP/image-docker-config"
          export DOCKER_CONFIG="$RUNNER_TEMP/image-docker-config"
          bash .github/hosted-image-smoke.sh 2>&1 | tee image-validation/run.log
      - name: Retain source, image and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-image-validation
          path: image-validation/
