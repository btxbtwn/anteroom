name: Descendant verification

# Verification evidence only. This name is deliberately NOT "CI": the hosted
# workflow_run deployment listens to CI. No push, PR, release or deploy trigger.
on:
  workflow_dispatch:
    inputs:
      expected_target:
        description: Full SHA of the chosen main descendant; must equal this workflow's event and checkout.
        required: true
        type: string
      production_base:
        description: Recorded production commit SHA for the reviewed backlog (not a claim about actual live schema/images).
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Unique to verification. Never enter or alter production's deploy concurrency.
concurrency:
  group: descendant-verification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact target, corrected ancestry and production-to-target span
        env:
          TARGET: ${{ inputs.expected_target }}
          PRODUCTION_BASE: ${{ inputs.production_base }}
        run: python3 .github/scripts/verification_evidence.py prepare --target "$TARGET" --production-base "$PRODUCTION_BASE" > verification-source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-source.json
          if-no-files-found: error
          retention-days: 30

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      full_verification: true
    # No secrets inheritance, production environment or write permission.

  evidence:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-inventory-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: inventories
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-evidence
      - name: Validate exact-attempt GitHub job results and shard completeness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verification_evidence.py receipt --evidence evidence/verification-source.json --inventories inventories --browser browser-evidence/verification-browser.json > verification-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipt.json
          if-no-files-found: error
          retention-days: 30
