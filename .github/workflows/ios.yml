name: iPhone app

on:
  pull_request:
    paths:
      - "anteroom-ios/**"
      - ".github/workflows/ios.yml"
      - "vendoo-studio/server/**"
      - "vendoo-studio/pyproject.toml"
  push:
    branches: [main]
    paths:
      - "anteroom-ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Xcode every job builds with. Change it on purpose, in its own PR.
env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  build:
    name: Build for Simulator
    runs-on: macos-26
    defaults:
      run:
        working-directory: anteroom-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Install the pinned XcodeGen
        run: ./tools/install-xcodegen.sh
      - name: Generate the Xcode project
        run: xcodegen
      - name: Only the confirmation dialog makes seller confirmations
        run: |
          # Tests may make one directly; app code must go through the dialog.
          if grep -rn "unitTestOnly" Sources --include='*.swift' | grep -v '^Sources/Editor/SellerConfirmation.swift:'; then
            echo "App code must not call SellerConfirmation.unitTestOnly" >&2
            exit 1
          fi
      - name: Restore Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('anteroom-ios/Config/Package.resolved') }}
      - name: Test stream framing
        run: |
          xcrun swiftc Sources/API/StreamFrame.swift Tests/StreamFramesTests.swift -o "$RUNNER_TEMP/stream-tests"
          "$RUNNER_TEMP/stream-tests"
      - name: Test history contracts
        run: |
          xcrun swiftc Sources/API/HistoryModels.swift Tests/HistoryModelsTests.swift -o "$RUNNER_TEMP/history-tests"
          "$RUNNER_TEMP/history-tests"
      - name: Test seller input preservation
        run: |
          xcrun swiftc Sources/Inputs/SellerInputs.swift Tests/SellerInputsTests.swift -o "$RUNNER_TEMP/seller-input-tests"
          "$RUNNER_TEMP/seller-input-tests"
      - name: Test inventory rules and lossless listing edits
        run: |
          xcrun swiftc Sources/API/Models.swift Sources/API/MarketplaceReadiness.swift Sources/Inventory/InventoryFilters.swift Sources/Inventory/Suggestions.swift Tests/InventoryTests.swift -o "$RUNNER_TEMP/inventory-tests"
          "$RUNNER_TEMP/inventory-tests"
      - name: Test native marketplace forms
        run: |
          xcrun swiftc Sources/API/Models.swift Sources/API/NativeFormModels.swift Sources/API/EbayFormModels.swift Tests/NativeFormTests.swift -o "$RUNNER_TEMP/native-form-tests"
          "$RUNNER_TEMP/native-form-tests"
      - name: Test eBay form rules, variations and categories
        run: |
          xcrun swiftc Sources/API/Models.swift Sources/API/NativeFormModels.swift Sources/API/EbayFormModels.swift Tests/EbayFormTests.swift -o "$RUNNER_TEMP/ebay-form-tests"
          "$RUNNER_TEMP/ebay-form-tests"
      - name: Test analytics contract and wording
        run: |
          xcrun swiftc Sources/API/Models.swift Sources/Analytics/AnalyticsModels.swift Tests/AnalyticsTests.swift -o "$RUNNER_TEMP/analytics-tests"
          "$RUNNER_TEMP/analytics-tests"
      - name: Test photo crop arithmetic
        run: |
          xcrun swiftc Sources/API/Models.swift Sources/Photos/CropMath.swift Tests/CropMathTests.swift -o "$RUNNER_TEMP/crop-tests"
          "$RUNNER_TEMP/crop-tests"
      - name: Test automation requests
        run: |
          xcrun swiftc Sources/API/Models.swift Sources/Automations/AutomationModels.swift Tests/AutomationTests.swift -o "$RUNNER_TEMP/automation-tests"
          "$RUNNER_TEMP/automation-tests"
      - name: Test eBay offers, sharing and offers-to-likers setup
        run: |
          xcrun swiftc Sources/API/Models.swift Sources/Automations/AutomationModels.swift Tests/MarketplaceAutomationTests.swift -o "$RUNNER_TEMP/marketplace-automation-tests"
          "$RUNNER_TEMP/marketplace-automation-tests"
      - name: Test business assistant contract and wording
        run: |
          xcrun swiftc Sources/API/Models.swift Sources/API/AssistantModels.swift Sources/Automations/AutomationModels.swift Sources/Assistant/BusinessAssistantModels.swift Tests/BusinessAssistantTests.swift -o "$RUNNER_TEMP/business-assistant-tests"
          "$RUNNER_TEMP/business-assistant-tests"
      - name: Test appearance preference contract
        run: |
          xcrun swiftc Sources/API/AppearancePreferences.swift Tests/AppearancePreferencesTests.swift -o "$RUNNER_TEMP/appearance-tests"
          "$RUNNER_TEMP/appearance-tests"
      - name: Test List, Update, Save draft and Delist rows and confirmations
        run: |
          xcrun swiftc Sources/API/Models.swift Sources/Inventory/InventoryFilters.swift Sources/API/MarketplaceReadiness.swift Sources/API/MarketplaceActionModels.swift Tests/MarketplaceActionsTests.swift -o "$RUNNER_TEMP/marketplace-action-tests"
          "$RUNNER_TEMP/marketplace-action-tests"
      - name: Test assistant Markdown blocks
        run: |
          xcrun swiftc Sources/Assistant/MarkdownBlocks.swift Tests/MarkdownBlocksTests.swift -o "$RUNNER_TEMP/markdown-tests"
          "$RUNNER_TEMP/markdown-tests"
      - name: Test sign-in messages
        run: |
          xcrun swiftc Sources/Session/SignInMessages.swift Tests/SignInMessagesTests.swift -o "$RUNNER_TEMP/sign-in-tests"
          "$RUNNER_TEMP/sign-in-tests"
      - name: Test eBay and Etsy sign-in return links
        run: |
          xcrun swiftc Sources/Session/MarketplaceSignInReturn.swift Tests/MarketplaceSignInReturnTests.swift -o "$RUNNER_TEMP/marketplace-sign-in-tests"
          "$RUNNER_TEMP/marketplace-sign-in-tests"
      - name: Test marketplace readiness and List everywhere choices
        run: |
          xcrun swiftc Sources/API/MarketplaceReadiness.swift Tests/MarketplaceReadinessTests.swift -o "$RUNNER_TEMP/readiness-tests"
          "$RUNNER_TEMP/readiness-tests"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Anteroom.xcodeproj \
            -scheme Anteroom \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO
      - name: Check the app's privacy manifest and version
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Anteroom.app"
          plutil -lint "$app/PrivacyInfo.xcprivacy"
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          expected="$(tr -d '[:space:]' < ../vendoo-studio/VERSION)"
          echo "App version $built"
          test "$built" = "$expected"

  sandbox-tests:
    name: iPhone unit and sandbox tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Install the pinned XcodeGen
        run: ./anteroom-ios/tools/install-xcodegen.sh
      - name: Prepare disposable hosted API and simulator project
        run: |
          cd vendoo-studio
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Initialize Xcode simulator components
        run: sudo xcodebuild -runFirstLaunch
      - name: Connect to CoreSimulator before runtime discovery
        run: xcrun simctl list
      - name: Install the iOS simulator runtime
        run: xcodebuild -downloadPlatform iOS
      - name: Boot the simulator
        run: |
          set -euxo pipefail
          SIMULATOR_ID="$(xcrun simctl create 'Anteroom sandbox tests' 'com.apple.CoreSimulator.SimDeviceType.iPhone-17')"
          # Boot before the tests: a cold boot inside the first test's launch
          # took over 100 seconds and timed out its first screen query.
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          # The keyboard's swipe-typing introduction covers the first
          # keyboard and drops keys typed while it closes.
          xcrun simctl spawn "$SIMULATOR_ID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Run unit tests
        working-directory: anteroom-ios
        run: |
          set -o pipefail
          xcodegen
          xcodebuild test \
            -project Anteroom.xcodeproj \
            -scheme Anteroom \
            -only-testing:AnteroomTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO
      - name: Run the iPhone app against the hosted sandbox
        run: |
          set -euxo pipefail
          ANTEROOM_TEST_DESTINATION="platform=iOS Simulator,id=$SIMULATOR_ID" \
            ANTEROOM_TEST_RESULTS="$RUNNER_TEMP/sandbox.xcresult" ./anteroom-ios/test-sandbox.sh
      - name: Boot an iPad simulator
        run: |
          set -euxo pipefail
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          # Device type names change between Xcode releases, and xcodebuild
          # does not offer older iPads as test destinations: take the newest
          # M-chip iPad Air (or iPad Pro), created like the iPhone above.
          IPAD_TYPE="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, re, sys
          ids = [d["identifier"] for d in json.load(sys.stdin)["devicetypes"]]
          def newest(kind):
              found = [(int(m.group(1)), i) for i in ids if (m := re.search(kind + r".*-M(\d+)", i))]
              return max(found)[1] if found else None
          print(newest("iPad-Air") or newest("iPad-Pro"))
          ')"
          IPAD_ID="$(xcrun simctl create 'Anteroom iPad sandbox tests' "$IPAD_TYPE")"
          xcrun simctl bootstatus "$IPAD_ID" -b
          xcrun simctl spawn "$IPAD_ID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          echo "IPAD_ID=$IPAD_ID" >> "$GITHUB_ENV"
      - name: Run the iPad layout against the hosted sandbox
        run: |
          set -euxo pipefail
          ANTEROOM_TEST_DESTINATION="platform=iOS Simulator,id=$IPAD_ID" \
            ANTEROOM_TEST_ONLY=AnteroomUITests/IPadSandboxTests \
            ANTEROOM_TEST_RESULTS="$RUNNER_TEMP/sandbox-ipad.xcresult" ./anteroom-ios/test-sandbox.sh || {
              xcrun simctl list devices available
              exit 1
            }
      - name: Export simulator screenshots
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/sandbox.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/sandbox.xcresult" --output-path "$RUNNER_TEMP/screenshots"
          fi
          if [[ -d "$RUNNER_TEMP/sandbox-ipad.xcresult" ]]; then
            mkdir -p "$RUNNER_TEMP/screenshots/ipad"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/sandbox-ipad.xcresult" --output-path "$RUNNER_TEMP/screenshots/ipad"
          fi
      - name: Keep simulator results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-sandbox-results
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/sandbox.xcresult
            ${{ runner.temp }}/sandbox-ipad.xcresult
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/sandbox.log

  testflight:
    name: Upload to TestFlight
    # Only main uploads, and only after the build and every test pass. Pull
    # requests (including forks) and other branches never reach the signing key.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, sandbox-tests]
    runs-on: macos-26
    defaults:
      run:
        working-directory: anteroom-ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Install the pinned XcodeGen
        run: ./tools/install-xcodegen.sh
      - name: Generate the Xcode project
        run: xcodegen
      # Archive unsigned: development signing would need a registered device.
      # The export below signs for App Store distribution with the API key.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Anteroom.xcodeproj \
            -scheme Anteroom \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Anteroom.xcarchive" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$(tr -d '[:space:]' < ../vendoo-studio/VERSION)" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Anteroom.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
