name: Chrome Web Store

# Submit only the exact main commit whose push CI succeeded. Manual runs
# use the same exact-commit check, and never run from another branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  submit:
    name: Package and submit
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # One submission at a time, never cancelled midway.
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Secrets live in this environment, which only main may use.
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 .github/scripts/chrome-web-store.py verify-ci --repo "$GITHUB_REPOSITORY" --sha "$TARGET_SHA"

      - name: Package the Bridge
        id: package
        run: |
          version=$(python3 .github/scripts/chrome-web-store.py package --out "$RUNNER_TEMP/anteroom-bridge.zip")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anteroom-bridge-${{ steps.package.outputs.version }}
          path: ${{ runner.temp }}/anteroom-bridge.zip
          retention-days: 30

      - name: Submit to the Chrome Web Store
        env:
          CHROME_WEB_STORE_SERVICE_ACCOUNT: ${{ secrets.CHROME_WEB_STORE_SERVICE_ACCOUNT }}
          CHROME_WEB_STORE_PUBLISHER_ID: ${{ secrets.CHROME_WEB_STORE_PUBLISHER_ID }}
        run: python3 .github/scripts/chrome-web-store.py release --package "$RUNNER_TEMP/anteroom-bridge.zip"
