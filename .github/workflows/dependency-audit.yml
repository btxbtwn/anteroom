name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked Python dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vendoo-studio/uv.lock
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"
      - name: Install locked audit tools
        run: |
          python -m venv .venv
          ./scripts/install-locked.sh .venv/bin/python dev
      - name: Lock matches pyproject.toml
        run: uv lock --check
      - name: Audit locked Python dependencies (dev, hosted image, Mac app and build backend)
        run: |
          uv export --frozen --no-emit-project --all-extras --all-groups --format requirements-txt --hashes \
            --quiet --output-file "$RUNNER_TEMP/locked.txt"
          .venv/bin/python -m pip_audit --disable-pip --require-hashes -r "$RUNNER_TEMP/locked.txt"
