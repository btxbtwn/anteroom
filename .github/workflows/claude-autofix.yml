name: Claude auto-fix

# Answers open Claude and Codex review findings and failed product CI jobs,
# and resolves real merge conflicts with main ("Bring PR to ready"): verifies
# them against the current code, fixes the real ones, replies in each finding
# thread and posts the round's result. Auto-merge is paused first (AGENTS.md:
# never push to a queued PR). Claude pushes its fix with the Claude GitHub App
# token, which starts CI and is revoked when the action ends. Auto-merge stays
# off afterwards; whoever checks every finding queues the PR again. At most
# three pushed rounds. Auto-fix never publishes listings or touches .github/,
# anteroom/VERSION or CHANGELOG.md (protected-path conflicts stay human).
# See docs/pr-review-bots.md.

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
  # Codex posts its reviews as a GitHub App, so its reviews start this
  # workflow. Reviews posted by the workflow token never do.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        type: number
        required: true
  # Product CI finished red on a pull request: fix from the failed job logs.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve pull request
    # In a called workflow github.event_name is the caller's event (push from
    # claude-conflict-autofix.yml, pull_request from claude-review.yml), so
    # workflow_call and workflow_dispatch are recognised by their PR input.
    if: >-
      inputs.pr_number > 0 ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      pr: ${{ steps.out.outputs.pr }}
      branch: ${{ steps.out.outputs.branch }}
      open: ${{ steps.out.outputs.open }}
      same_repo: ${{ steps.out.outputs.same_repo }}
      ci_run_id: ${{ steps.out.outputs.ci_run_id }}
      skip: ${{ steps.out.outputs.skip }}
    steps:
      - name: Resolve
        id: out
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number || github.event.pull_request.number || 0 }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          CI_RUN: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          pr="$INPUT_PR"
          ci_run_id=""
          if [ "$EVENT" = "workflow_run" ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq "map(select(.state == \"open\" and (.draft | not) and .head.sha == \"$HEAD_SHA\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\")) | .[0].number // empty")"
            ci_run_id="$CI_RUN"
            if [ -z "$pr" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No open same-repo pull request for $HEAD_SHA."
              exit 0
            fi
          fi
          if [ -z "$pr" ] || [ "$pr" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          meta="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRepository,headRepositoryOwner,isDraft,state)"
          branch="$(printf '%s' "$meta" | jq -r .headRefName)"
          same_repo="$(printf '%s' "$meta" | jq -r --arg repo "$GITHUB_REPOSITORY" \
            '(.headRepositoryOwner.login + "/" + .headRepository.name) == $repo')"
          open="$(printf '%s' "$meta" | jq -r '.state == "OPEN" and (.isDraft | not)')"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "same_repo=$same_repo" >> "$GITHUB_OUTPUT"
          echo "open=$open" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          if [ "$same_repo" = "true" ] && [ "$open" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  autofix:
    name: Claude auto-fix
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One round at a time per pull request; a newer trigger waits.
    concurrency:
      group: claude-autofix-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.resolve.outputs.pr }}
      CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      # Before prepare: it may create the main merge commit itself.
      - name: Set commit author
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
      # workflow_run always uses this file from the default branch, and the
      # push-triggered conflict caller runs from main too; keep the bot scripts
      # in sync with that definition so older PR heads still work. Extract
      # outside the worktree so Claude cannot stage them into a fix.
      - name: Load review-bot scripts
        id: bot
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.event_name }}" = "push" ]; then
            git fetch --quiet origin "${{ github.event.repository.default_branch }}"
            mkdir -p "$RUNNER_TEMP/review-bot-src"
            git archive "origin/${{ github.event.repository.default_branch }}" .github/review-bot \
              | tar -x -C "$RUNNER_TEMP/review-bot-src"
            echo "dir=$RUNNER_TEMP/review-bot-src/.github/review-bot" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$GITHUB_WORKSPACE/.github/review-bot" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect open findings and CI failures
        id: prepare
        run: python3 "${{ steps.bot.outputs.dir }}/review_bot.py" prepare-autofix --pr "$PR" --out "$RUNNER_TEMP/claude-autofix"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.prepare.outputs.skip == 'false'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: anteroom/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.prepare.outputs.skip == 'false'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: anteroom/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.prepare.outputs.skip == 'false'
        with:
          version: "0.12.13"
      # A conflicted lockfile has markers in it and cannot install; Claude
      # resolves it without the test environment.
      - name: Install dependencies so Claude can run tests
        if: steps.prepare.outputs.skip == 'false' && steps.prepare.outputs.lockfile_conflict != 'true'
        working-directory: anteroom
        run: |
          python -m venv .venv
          ./scripts/install-locked.sh .venv/bin/python dev
          npm ci --no-audit --no-fund
      - name: Load output schema
        if: steps.prepare.outputs.skip == 'false'
        id: schema
        run: echo "json=$(jq -c . "${{ steps.bot.outputs.dir }}/autofix-schema.json")" >> "$GITHUB_OUTPUT"
      - name: Pause auto-merge
        if: steps.prepare.outputs.skip == 'false'
        id: automerge
        run: |
          queued="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$queued" = "true" ]; then gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto; fi
          echo "was_queued=$queued" >> "$GITHUB_OUTPUT"
      - name: Fix with Claude
        if: steps.prepare.outputs.skip == 'false'
        id: claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "chatgpt-codex-connector[bot],claude[bot],dependabot[bot]"
          allow_fork_prs: "false"
          prompt: |
            Follow ${{ steps.bot.outputs.dir }}/autofix-prompt.md.
            Repository: ${{ github.repository }}
            Pull request: #${{ env.PR }}
            Context directory: ${{ runner.temp }}/claude-autofix
          claude_args: >-
            --model opus
            --permission-mode acceptEdits
            --add-dir ${{ runner.temp }}/claude-autofix
            --add-dir ${{ steps.bot.outputs.dir }}
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(cd:*),Bash(ls:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git fetch:*),Bash(git merge:*),Bash(./check.sh --fast:*),Bash(.venv/bin/python -m pytest:*),Bash(anteroom/.venv/bin/python -m pytest:*),Bash(.venv/bin/ruff:*),Bash(anteroom/.venv/bin/ruff:*),Bash(npx vitest:*),Bash(npm test:*),Bash(npm run lint:*),Bash(node --test:*),Bash(gh pr view:*)"
            --disallowedTools "Edit(.github/**),Write(.github/**),Edit(anteroom/VERSION),Write(anteroom/VERSION),Edit(CHANGELOG.md),Write(CHANGELOG.md)"
            --json-schema '${{ steps.schema.outputs.json }}'
      - name: Reply to findings
        if: steps.prepare.outputs.skip == 'false' && !cancelled()
        env:
          AUTOFIX_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          WAS_QUEUED: ${{ steps.automerge.outputs.was_queued }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
        run: >-
          python3 "${{ steps.bot.outputs.dir }}/review_bot.py" post-autofix
          --context "$RUNNER_TEMP/claude-autofix" --branch "$BRANCH"
