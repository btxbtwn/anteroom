name: Claude auto-fix

# Answers every open Claude and Codex review finding ("Bring PR to ready"):
# verifies it against the current code, fixes the real ones, replies in each
# thread and posts the round's result. Claude commits; review_bot.py pushes
# with the Claude GitHub App token, so CI runs on the new commit, and turns
# auto-merge off first. At most three pushed rounds per pull request.
# Auto-fix never publishes listings or touches .github/, VERSION or
# CHANGELOG.md. See docs/pr-review-bots.md.

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
  # Codex posts its reviews as a GitHub App, so its reviews start this
  # workflow. Reviews posted by the workflow token never do.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        type: number
        required: true

permissions:
  contents: read

jobs:
  autofix:
    name: Claude auto-fix
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One round at a time per pull request; a newer trigger waits.
    concurrency:
      group: claude-autofix-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr_number || github.event.pull_request.number }}
    steps:
      - name: Read pull request
        id: pr
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRepository,headRepositoryOwner,isDraft,state \
            --jq '"branch=\(.headRefName)\nsame_repo=\(.headRepositoryOwner.login + "/" + .headRepository.name == env.GITHUB_REPOSITORY)\nopen=\(.state == "OPEN" and (.isDraft | not))"' \
            >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.same_repo == 'true' && steps.pr.outputs.open == 'true'
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Collect open findings
        if: steps.pr.outputs.same_repo == 'true' && steps.pr.outputs.open == 'true'
        id: prepare
        run: python3 .github/review-bot/review_bot.py prepare-autofix --pr "$PR" --out "$RUNNER_TEMP/claude-autofix"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.prepare.outputs.skip == 'false'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: anteroom/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.prepare.outputs.skip == 'false'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: anteroom/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.prepare.outputs.skip == 'false'
        with:
          version: "0.12.13"
      - name: Install dependencies so Claude can run tests
        if: steps.prepare.outputs.skip == 'false'
        working-directory: anteroom
        run: |
          python -m venv .venv
          ./scripts/install-locked.sh .venv/bin/python dev
          npm ci --no-audit --no-fund
      - name: Set commit author
        if: steps.prepare.outputs.skip == 'false'
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
      - name: Load output schema
        if: steps.prepare.outputs.skip == 'false'
        id: schema
        run: echo "json=$(jq -c . .github/review-bot/autofix-schema.json)" >> "$GITHUB_OUTPUT"
      - name: Fix with Claude
        if: steps.prepare.outputs.skip == 'false'
        id: claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "chatgpt-codex-connector[bot],claude[bot],dependabot[bot]"
          allow_fork_prs: "false"
          prompt: |
            Follow .github/review-bot/autofix-prompt.md.
            Repository: ${{ github.repository }}
            Pull request: #${{ env.PR }}
            Context directory: ${{ runner.temp }}/claude-autofix
          claude_args: >-
            --model opus
            --permission-mode acceptEdits
            --add-dir ${{ runner.temp }}/claude-autofix
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(cd:*),Bash(ls:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(./check.sh --fast:*),Bash(.venv/bin/python -m pytest:*),Bash(anteroom/.venv/bin/python -m pytest:*),Bash(.venv/bin/ruff:*),Bash(anteroom/.venv/bin/ruff:*),Bash(npx vitest:*),Bash(npm test:*),Bash(npm run lint:*),Bash(node --test:*),Bash(gh pr view:*)"
            --disallowedTools "Bash(git push:*),Edit(.github/**),Write(.github/**),Edit(VERSION),Edit(anteroom/VERSION),Write(anteroom/VERSION),Edit(CHANGELOG.md)"
            --json-schema '${{ steps.schema.outputs.json }}'
      - name: Push fix and reply to findings
        if: steps.prepare.outputs.skip == 'false' && !cancelled()
        env:
          AUTOFIX_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          # The Claude GitHub App token: pushes made with it start CI.
          PUSH_TOKEN: ${{ steps.claude.outputs.github_token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: >-
          python3 .github/review-bot/review_bot.py post-autofix
          --context "$RUNNER_TEMP/claude-autofix" --branch "$BRANCH"
